<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">皇室战争 表情图鉴 · Clash Royale Emote Gallery</title>
<style>
:root{
  --bg:#f4f6fb; --bg2:#e9edf8;
  --ink:#131a2e; --ink2:#4a5570; --ink3:#8792ad;
  --line:#e3e7f2; --card:#ffffff;
  --blue:#3b6ef0; --violet:#7c5cf0; --gold:#e0a020; --goldbg:#fff6e0;
  --red:#e0453a; --green:#1a9e5f;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,30,70,.05), 0 8px 24px -12px rgba(20,30,70,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#eef2fb 0%, var(--bg) 340px, var(--bg) 100%);
  color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#141c3d 0%,#26307a 42%,#5b3fb4 100%);
}
.hero:before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(700px 320px at 12% -10%,rgba(120,170,255,.35),transparent 60%),
    radial-gradient(600px 300px at 88% 0%,rgba(255,190,80,.22),transparent 60%);
}
.hero .wrap{position:relative;padding:54px 20px 34px}
.chip-top{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:12.5px;letter-spacing:.14em;font-weight:600;
}
.chip-top b{color:#ffd15c;letter-spacing:.02em}
h1{margin:16px 0 8px;font-size:clamp(26px,4.4vw,44px);line-height:1.14;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ffd15c,#ffb03a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;max-width:74ch;color:rgba(255,255,255,.76);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:28px}
.stat{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px);
}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12px;color:rgba(255,255,255,.7)}
.stat.warn b{color:#ffcf5c}
.hint{margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.55)}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 18px -16px rgba(20,30,70,.5);
}
.toolbar .wrap{padding:11px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.search{position:relative;flex:1 1 250px;min-width:210px}
.search input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none;
}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,240,.14)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
select,.tgl{
  padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer;outline:none;
}
select:focus{border-color:var(--blue)}
.tgl:hover{border-color:#c9d2ea}
.tgl.on{background:linear-gradient(180deg,#3b6ef0,#2b56cc);border-color:#2b56cc;color:#fff;font-weight:600}
.tgl.gold.on{background:linear-gradient(180deg,#e8a92c,#cf8f0f);border-color:#cf8f0f;color:#3a2600}
.clear{background:none;border:none;color:var(--ink3);font:inherit;font-size:13px;cursor:pointer;padding:9px 4px}
.clear:hover{color:var(--red)}
.years{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-top:3px}
.ybtn{
  padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;font-variant-numeric:tabular-nums;
}
.ybtn:hover{border-color:#c9d2ea}
.ybtn.on{background:#1b2559;border-color:#1b2559;color:#fff}

/* ---------- grid ---------- */
main{padding:20px 0 70px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.bar .n{font-size:13.5px;color:var(--ink2)}
.bar .n b{color:var(--ink)}
.bar .tip{font-size:12.5px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:13px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
  display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfd8ee}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card .stripe{height:3px;background:var(--hc,#94a3b8)}
.thumb{
  position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#fbfcff,#eceff9);
  border-bottom:1px solid #f0f2fa;overflow:hidden;
}
.thumb img{max-width:86%;max-height:86%;object-fit:contain;transition:transform .18s ease}
.card:hover .thumb img{transform:scale(1.05)}
.thumb .none{display:flex;flex-direction:column;align-items:center;gap:6px;color:#b3bcd1}
.thumb .none svg{opacity:.75}
.thumb .none span{font-size:11.5px;letter-spacing:.06em}
.badge-ex{
  position:absolute;top:7px;right:7px;z-index:2;
  background:linear-gradient(180deg,#ffe08a,#f0b21f);color:#4a3200;
  font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:999px;
  box-shadow:0 2px 6px -2px rgba(150,100,0,.5);
}
.badge-off{background:linear-gradient(180deg,#e6e9f2,#cfd5e4);color:#4a5570}
.badge-anim{
  position:absolute;left:7px;bottom:7px;z-index:2;width:17px;height:17px;border-radius:50%;
  background:rgba(30,40,70,.48);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:8px;line-height:1;padding-left:1.5px;pointer-events:none;
}
.thumb img.anim-on{max-width:92%;max-height:92%}
/* ---------- 音效按钮 ---------- */
.sfx-btn{
  position:absolute;right:7px;bottom:7px;z-index:3;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.94);color:#41506e;padding:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transform:translateY(2px);
  transition:opacity .16s,transform .16s,background .16s,color .16s,border-color .16s;
  box-shadow:0 2px 6px -2px rgba(20,28,60,.4);
}
.card:hover .sfx-btn,.card:focus-within .sfx-btn,.sfx-btn:focus-visible{opacity:1;transform:none}
.sfx-btn:hover{background:var(--hc,#4f7cf0);color:#fff;border-color:transparent}
.sfx-btn.on{
  opacity:1;transform:none;background:var(--hc,#4f7cf0);color:#fff;border-color:transparent;
  animation:sfxpulse 1s ease-in-out infinite;
}
@keyframes sfxpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media(hover:none){.sfx-btn{opacity:1;transform:none}}
.snd-off .sfx-btn{opacity:.28;filter:grayscale(1)}
.snd-off .card:hover .sfx-btn{opacity:.5}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.cname{font-size:13px;font-weight:650;line-height:1.3;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:auto}
.fam{
  font-size:11px;padding:2px 7px;border-radius:6px;background:var(--hb,#f1f4fb);color:var(--hc,#4a5570);
  font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.yr{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:22px}
.lb.open{display:flex}
.lb-bg{position:absolute;inset:0;background:rgba(15,21,44,.55);backdrop-filter:blur(4px)}
.lb-panel{
  position:relative;background:#fff;border-radius:18px;width:min(880px,100%);max-height:88vh;overflow:auto;
  box-shadow:0 40px 90px -30px rgba(10,16,40,.55);display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);
}
@media(max-width:720px){.lb-panel{grid-template-columns:1fr}}
.lb-vis{background:radial-gradient(circle at 50% 40%,#f8faff,#e9eefb);display:flex;align-items:center;justify-content:center;padding:22px;border-right:1px solid var(--line)}
.lb-vis img{max-width:100%;max-height:min(46vh,340px);object-fit:contain}
.lb-vis .none{color:#adb6cc;text-align:center}
.lb-info{padding:22px 24px 26px;min-width:0}
.lb-info h2{margin:0 0 4px;font-size:22px;line-height:1.25;letter-spacing:-.02em}
.lb-sub{color:var(--ink3);font-size:13px;margin-bottom:16px}
.lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.snd-play{
  display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:9px;margin-bottom:16px;
  border:1px solid #c9d2ea;background:#f4f6fb;color:var(--ink2);font-size:12.5px;font-weight:650;cursor:pointer;
  font-family:inherit;transition:background .16s,border-color .16s,color .16s;
}
.snd-play:hover{background:#e8edf9;border-color:#aebbd9}
.snd-play.on{background:linear-gradient(180deg,#ffe08a,#f0b21f);border-color:transparent;color:#4a3200}
.snd-play[disabled]{opacity:.45;cursor:not-allowed;background:#f2f4f9}
.tg{font-size:11.5px;padding:3px 9px;border-radius:999px;background:#f1f4fb;color:var(--ink2);font-weight:600}
.tg.g{background:var(--goldbg);color:#8a5c00}
.tg.r{background:#fdecea;color:#a52c22}
.tg.b{background:#e8efff;color:#25459e}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px}
dt{color:var(--ink3);white-space:nowrap}
dd{margin:0;color:var(--ink);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.lb-note{margin-top:14px;padding:10px 12px;border-radius:10px;background:#fff8e6;border:1px solid #f3e2b8;color:#7a5a10;font-size:12.5px}
.lb-nav{position:absolute;top:12px;right:14px;display:flex;gap:6px}
.lb-nav button{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;
  color:var(--ink2);font-size:15px;line-height:1;display:grid;place-items:center;
}
.lb-nav button:hover{background:#f4f6fb;border-color:#c9d2ea}
footer{border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;padding:22px 0 40px}
footer code{background:#eef1f8;padding:1.5px 5px;border-radius:5px;font-size:12px;color:var(--ink2)}
.empty{padding:60px 0;text-align:center;color:var(--ink3)}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.grp .tgl{border:none;border-radius:0;font-size:13px;padding:9px 11px}
.grp .tgl + .tgl{border-left:1px solid var(--line)}
.grp .tgl.on{font-weight:600}
</style>
</head>

<header class="hero">
  <div class="wrap">
    <div class="chip-top">CLASH ROYALE · <b>EMOTE GALLERY</b></div>
    <h1 data-i18n-html="h1">皇室战争 <em>全部表情</em> 图鉴</h1>
    <p class="lead" id="lead"></p>
    <div class="stats" id="stats"></div>
    <div class="hint" data-i18n="hint">↓ 向下滚动浏览 · 悬停看动画 · 点击卡片查看完整数据并试听音效</div>
  </div>
</header>

<nav class="toolbar">
  <div class="wrap">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#131a2e" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" data-i18n-ph="search" placeholder="搜索名称 / 家族 / 资源文件名…" autocomplete="off">
    </label>
    <select id="fam"><option value="" data-i18n="famAll">全部家族</option></select>
    <select id="sort">
      <option value="idx" data-i18n="sortIdx">按游戏内序号</option>
      <option value="date-desc" data-i18n="sortDateDesc">日期：新 → 旧</option>
      <option value="date-asc" data-i18n="sortDateAsc">日期：旧 → 新</option>
      <option value="name" data-i18n="sortName">名称 A → Z</option>
      <option value="fam" data-i18n="sortFam">家族分组</option>
    </select>
    <button class="tgl gold" id="t-ex" data-i18n="tEx" data-i18n-title="tExTip" title="仅看限定/绝版表情">★ 限定</button>
    <button class="tgl" id="t-do" data-i18n="own" data-i18n-title="ownTip" title="仅看开局默认拥有">默认拥有</button>
    <button class="tgl" id="t-snd" data-i18n="snd" data-i18n-title="sndTip" title="开关表情音效：点击卡片或 🔊 按钮时播放">♫ 音效</button>

</nav>

<main class="wrap">
  <div class="bar">
    <div class="n" id="count"></div>
    <div class="tip" data-i18n="countNote">表情收录截止到2026年6月。</div>
  </div>

  <span id="f-drop"></span></div>

const FAMZH = {"Archer Queen":"弓箭女皇","Archers":"弓箭手","Baby Dragon":"飞龙宝宝","Balloon":"气球兵","Bandit":"刺客","Barbarian Barrel":"野蛮人滚桶","Barbarian8bit":"8-bit 野蛮人","Barbarians":"野蛮人","Bats":"蝙蝠","Battle Healer":"战斗天使","Battle Ram":"野蛮人攻城锤","Berserker":"狂战士","Bomber":"投弹兵","Boss Bandit":"刺客首领","Bowler":"巨石投手","CRL":"皇室战争联赛","Cannon":"加农炮","Cannoneer":"加农炮手","Chef":"皇家厨师","Dagger Duchess":"飞刀女爵","Dark Prince":"黑暗王子","Dart Goblin":"吹箭哥布林","Dragon":"飞龙","Electro Dragon":"雷电飞龙","Electro Giant":"雷电巨人","Electro Wizard":"电击法师","Elixir Golem":"圣水戈仑","Executioner":"飞斧屠夫","Firecracker":"烟花炮手","Fisherman":"渔夫","Furnace":"烈焰熔炉","Generic":"通用","Ghost":"幽灵国王","Giant":"巨人","Giant Skeleton":"骷髅巨人","Goblin Barrel":"哥布林飞桶","Goblin Cage":"哥布林牢笼","Goblin Drill":"哥布林钻机","Goblin Giant":"哥布林巨人","GoblinQueen":"哥布林女皇","Goblins":"哥布林","Goblinstein":"哥布林斯坦","Golden Knight":"黄金圣骑","Golem":"戈仑石人","Guards":"骷髅守卫","Hog Rider":"野猪骑士","Hunter":"猎人","Ice Golem":"戈仑冰人","Ice Wizard":"寒冰法师","Inferno Tower":"地狱之塔","King":"国王","King Chess":"国际象棋国王","King8bit":"8-bit 国王","Knight":"骑士","Lava Hound":"熔岩猎犬","Little Prince":"小王子","Log":"滚木","Lumberjack":"狂暴樵夫","Magic Archer":"神箭游侠","Mega Knight":"超级骑士","Mega Minion":"重甲亡灵","Mighty Miner":"威猛矿工","Miner":"掘地矿工","Mini Pekka":"迷你皮卡","Minion Horde":"亡灵大军","Minions":"亡灵","Monk":"盖世武僧","Mortar":"迫击炮","Mother Witch":"女巫婆婆","Musketeer":"火枪手","Night Witch":"暗夜女巫","Pekka":"皮卡超人","Phoenix":"凤凰","Prince":"王子","Princess":"公主","Ram Rider":"蛮羊骑士","Rascals":"淘气鬼","Rocket":"火箭","Royal Ghost":"幽灵","Royal Giant":"皇家巨人","Royal Hogs":"皇家野猪","RoyaleRecruit":"皇家新兵","Rune Giant":"符文巨人","Skeleton":"骷髅","Skeleton Dragons":"骷髅飞龙","Skeleton King":"骷髅帝王","Skeletons":"骷髅兵","Snowball":"雪球","Sparky":"电磁炮","Spirit":"精灵","Spirit Empress":"精灵女王","Suspicious Bush":"可疑草丛","Tesla":"特斯拉电磁塔","Text":"文字表情","Tombstone":"骷髅墓碑","Valkyrie":"女武神","Vines":"藤蔓","Wall Breakers":"攻城炸弹人","Witch":"女巫","Wizard":"法师","X Bow":"X连弩"};

const PALETTE = ["#4f7cf0","#7c5cf0","#c85cd8","#e0557b","#e07a2f","#c99a12","#3fa85f","#12a0a8","#5b6b8c","#8a6a4a","#3d7ab8","#a05cc8"];
function famColor(name){
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return PALETTE[h%PALETTE.length];
}
const CROWN = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 18h18M3 18l-1.2-9 5.4 3.4L12 5l4.8 7.4L22.2 9 21 18"/></svg>';
const SPK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- 音效引擎 ---------- */
const SND = { on: true };
try{ if(localStorage.getItem('cremote_snd') === '0') SND.on = false; }catch(_){}
function saveSnd(){ try{ localStorage.setItem('cremote_snd', SND.on?'1':'0'); }catch(_){} }

const audio = new Audio();
audio.preload = "none";
audio.volume = 0.9;
/* 显式记录「当前处于播放状态」的目标，不依赖 audio.paused
   （自动播放被浏览器策略拦截时 paused 会一直为 true，判断会错乱） */
let playingBtn = null;
let playingFile = null;
function setPlayState(btn, file){
  playingBtn = btn || null;
  playingFile = file || null;
  document.body.classList.toggle('snd-playing', !!file);
  const lbp = document.querySelector('.snd-play');
  if(lbp) lbp.classList.toggle('on', !!file && !btn);
}
function stopSfx(){
  try{ audio.pause(); }catch(_){}
  document.querySelectorAll('.sfx-btn.on').forEach(b=>b.classList.remove('on'));
  setPlayState(null, null);
}
function playSfx(file, btn){
  if(!file || !SND.on) return false;
  stopSfx();
  audio.src = SFX + file;
  try{
    const p = audio.play();
    if(p && p.catch) p.catch(()=>{});   // 策略拦截不算错误，交给状态管理
  }catch(_){}
  if(btn) btn.classList.add('on');
  setPlayState(btn || null, file);
  return true;
}
audio.addEventListener('ended', stopSfx);
audio.addEventListener('error', stopSfx);

/* ---------- 统计 ---------- */
(function(){
  const withAnim = E.filter(e=>e.a).length;
  const withSfx = E.filter(e=>e.sp).length;
  const fams = new Set(E.filter(e=>e.fg||e.f).map(e=>e.fg||e.f));
  const ys = E.map(e=>e.y).filter(Boolean).map(Number);
  const years = ys.length ? (Math.min(...ys)+"–"+Math.max(...ys)) : "—";
  const ex = E.filter(e=>e.ex).length;
  const dated = E.filter(e=>e.d).length;
  document.getElementById('lead').textContent =
    ``;
  const S=[
    [E.length,T("stTotal")],[withAnim,T("stAnim")],[withSfx,T("stSfx")],
    [fams.size,T("stFams")],[years,T("stYears")],[ex,T("stEx")],[dated,T("stDated")]
  ];
  document.getElementById('stats').innerHTML = S.map(([v,l],i)=>
    `<div class="stat${i===1||i===2?' warn':''}"><b>${v}</b><span>${l}</span></div>`).join('');
  const drop = META.droppedCount | 0;
  if(drop) document.getElementById('f-drop').textContent =
    ``;
})();

/* ---------- 筛选控件 ---------- */
const famCount = {};
E.forEach(e=>{ const k=e.fg||e.f; if(k) famCount[k]=(famCount[k]||0)+1; });
const famKeys = Object.keys(famCount);
/* 家族名显示：中文模式用官中译名（下拉按拼音排序），英文模式用官方英文名（按字母排序）。
   option 的 value 始终是规范英文名，筛选 / 分组逻辑不受影响。 */
function famLabel(k){ return window.LANG === 'en' ? (k||"") : (FAMZH[k] || k || ""); }
/* 中文按拼音、英文按字母比较两个家族名 */
function famCmp(a, b){
  const la = famLabel(a), lb = famLabel(b);
  return window.LANG === 'en' ? la.localeCompare(lb, 'en') : la.localeCompare(lb, 'zh-Hans-CN');
}
const famSel = document.getElementById('fam');
function buildFamOptions(){
  const cur = famSel.value;                 // 重建前记住选中项，切语言不丢筛选
  famSel.innerHTML = '<option value="">'+T("famAll")+'</option>' +
    famKeys.slice().sort(famCmp).map(f=>`<option value="${esc(f)}">${esc(famLabel(f))} (${famCount[f]})</option>`).join('');
  famSel.value = cur;
}
buildFamOptions();
const yearCount={};
E.forEach(e=>{ if(e.y) yearCount[e.y]=(yearCount[e.y]||0)+1; });
const yearsSorted=Object.keys(yearCount).sort();
document.getElementById('years').innerHTML = yearsSorted.map(y=>
  `<button class="ybtn" data-y="${y}">${y} <span style="opacity:.55">${yearCount[y]}</span></button>`).join('');

/* ---------- 状态 ---------- */
const S = {q:"", fam:"", sort:"idx", ex:false, img:false, dflt:false, years:new Set()};

function match(e){
  const fk = e.fg||e.f;
  if(S.fam && fk!==S.fam) return false;
  if(S.ex && !e.ex) return false;
  if(S.img && !e.img) return false;
  if(S.dflt && !e.do) return false;
  if(S.years.size && !S.years.has(e.y)) return false;
  if(S.q){
    const zh = FAMZH[fk]||"";
    const hay = (e.t+" "+e.n+" "+e.f+" "+fk+" "+zh+" "+e.sc+" "+e.sfx+" "+e.d).toLowerCase();
    if(!S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false;
  }
  return true;
}
function sortList(a,b){
  switch(S.sort){
    case "date-desc": return (b.d||"0000").localeCompare(a.d||"0000") || idx(a)-idx(b);
    case "date-asc":  return (a.d||"9999").localeCompare(b.d||"9999") || idx(a)-idx(b);
    case "name":      return (a.t||a.n).localeCompare(b.t||b.n);
    case "fam":       return famCmp(a.fg||a.f||"~", b.fg||b.f||"~") || (a.y||"").localeCompare(b.y||"");
    default:          return idx(a)-idx(b);
  }
}
const IDX = new Map(E.map((e,i)=>[e, i]));
function idx(e){ return IDX.get(e); }

/* ---------- 渲染 ---------- */
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
let VIEW = [];

function card(e){
  const fk = e.fg || e.f || "";
  const c = fk ? famColor(fk) : "#94a3b8";
  const img = e.img
    ? `<img loading="lazy" decoding="async" src="${IMG}${e.img}" alt="${esc(e.t)}"${e.a?` data-anim="${ANIM}${e.a}" data-static="${IMG}${e.img}"`:""} onerror="this.replaceWith(mkNone())">`
    : `<div class="none">${CROWN}<span>${T("noAsset")}</span></div>`;
  const badge = e.ex
    ? `<div class="badge-ex" title="${T('exTip')}">${T("tEx")}</div>`
    : (!e.av ? `<div class="badge-ex badge-off" title="${T('offTip')}">${T("offBadge")}</div>` : "");
  const play = e.a ? `<div class="badge-anim" title="${T('animTip')}">▶</div>` : "";
  const snd = e.sp
    ? `<button class="sfx-btn" data-sfx="${esc(e.sfx)}" title="${T('sfxPlayTip',esc(e.sfx))}" aria-label="${T('sfxAria')}">${SPK}</button>`
    : "";
  return `<article class="card" tabindex="0" data-n="${esc(e.n)}" style="--hc:${c};--hb:${c}1a">
    <div class="stripe"></div>
    <div class="thumb">${badge}${play}${img}${snd}</div>
    <div class="cbody">
      <div class="cname">${esc(e.t||e.n)}</div>
      <div class="cmeta">
        ${fk?`<span class="fam">${esc(famLabel(fk))}</span>`:""}
        <span class="yr">${e.y||"—"}</span>
      </div>
    </div>
  </article>`;
}
function mkNone(){ const d=document.createElement('div'); d.className='none'; d.innerHTML=CROWN+'<span>'+T("noAsset")+'</span>'; return d; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function render(){
  stopSfx();
  VIEW = E.filter(match).sort(sortList);
  countEl.innerHTML = T('countEmotes', VIEW.length, E.length);
  emptyEl.style.display = VIEW.length ? "none" : "block";
  grid.innerHTML = VIEW.map(card).join('');
}

/* ---------- 悬停播放动画（按需加载，首屏零开销） ---------- */
let hovEl = null, hovTimer = null;
function toAnim(img){
  const src = img.dataset.anim;
  if(!src || img.classList.contains('anim-on')) return;
  const pre = new Image();
  pre.onload = ()=>{ img.src = src; img.classList.add('anim-on'); img.dataset.loaded = "1"; };
  pre.src = src;
}
function toStatic(img){
  if(!img.classList.contains('anim-on')) return;
  img.src = img.dataset.static;
  img.classList.remove('anim-on');
}
grid.addEventListener('mouseover', ev=>{
  const img = ev.target.closest('.thumb img');
  if(img === hovEl) return;
  clearTimeout(hovTimer);
  if(hovEl) toStatic(hovEl);
  hovEl = img;
  if(!img || !img.dataset.anim) return;
  if(img.dataset.loaded){
    img.src = img.dataset.anim; img.classList.add('anim-on'); return;
  }
  hovTimer = setTimeout(()=>toAnim(img), 110);
});
grid.addEventListener('mouseleave', ()=>{
  clearTimeout(hovTimer);
  if(hovEl) toStatic(hovEl);
  hovEl = null;
});

grid.addEventListener('click', ev=>{
  const b = ev.target.closest('.sfx-btn');
  if(b){
    ev.preventDefault();
    const file = b.dataset.sfx;
    if(playingBtn === b && playingFile){ stopSfx(); return; }
    if(!SND.on){ SND.on = true; saveSnd(); syncSnd(); }
    playSfx(file, b);
    return;
  }
  const c = ev.target.closest('.card'); if(!c) return;
  openBy(VIEW.findIndex(e=>e.n===c.dataset.n));
});
grid.addEventListener('keydown', ev=>{
  if(ev.key!=="Enter"&&ev.key!==" ") return;
  if(ev.target.closest('.sfx-btn')) return;
  const c = ev.target.closest('.card'); if(!c) return;
  ev.preventDefault(); openBy(VIEW.findIndex(e=>e.n===c.dataset.n));
});

/* ---------- 详情 ---------- */
const lb = document.getElementById('lb');
let cur = -1;
function yn(v){ return v ? T("yes") : T("no"); }
function openBy(i){
  if(i<0||i>=VIEW.length) return;
  cur = i; const e = VIEW[i];
  document.getElementById('lb-vis').innerHTML = e.img
    ? (e.a
      ? `<img src="${ANIM}${e.a}" alt="${esc(e.t)}" onerror="this.onerror=null;this.src='${IMG}${e.img}'">`
      : `<img src="${IMG}${e.img}" alt="${esc(e.t)}">`)
    : `<div class="none">${CROWN}<div style="margin-top:8px">${T("noAssetLong")}</div></div>`;
  document.querySelectorAll('.tgl').forEach(()=>{});
  const tgs = [];
  if(e.ex) tgs.push('<span class="tg g">'+T("tgEx")+'</span>');
  if(!e.av) tgs.push('<span class="tg r">'+T("tgOff")+'</span>');
  if(e.do) tgs.push('<span class="tg b">'+T("tgOwn")+'</span>');
  if(e.ao) tgs.push('<span class="tg">'+T("tgShop")+'</span>');
  if(e.cb) tgs.push('<span class="tg">'+T("tgCb")+'</span>');
  const fk = e.fg || e.f;
  document.getElementById('lb-info').innerHTML = `
    <h2>${esc(e.t||e.n)}</h2>
    <div class="lb-sub">${fk?esc(famLabel(fk))+" · ":""}${e.d||T("noDate")}</div>
    <div class="lb-tags">${tgs.join('')}</div>
    <button class="snd-play" id="lb-play" data-sfx="${esc(e.sfx)}"${e.sp?"":' disabled'}>♫ ${e.sp?T("playSfx"):T("noSfx")}</button>
    <dl>
      <dt>${T("dataName")}</dt><dd>${esc(e.n)}</dd>
      <dt>${T("famKey")}</dt><dd>${esc(e.f||"—")}</dd>
      <dt>${T("date")}</dt><dd>${esc(e.d||"—")}</dd>
      <dt>${T("index")}</dt><dd>IndexHi ${esc(e.k||"—")} / IndexLo ${esc(e.i||"—")}</dd>
      <dt>${T("spriteFile")}</dt><dd>${esc(e.sc||"—")}</dd>
      <dt>${T("sfxFile")}</dt><dd>${esc(e.sfx||"—")}${e.sfx&&!e.sp?' <span style="color:#c0392b">${T("notIncluded")}</span>':""}</dd>
    </dl>
    ${e.note?`<div class="lb-note">${T("noImageNote",esc(e.note))}</div>`:""}
  `;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
  if(e.sp && SND.on) playSfx(e.sfx, null);
}
function close(){ stopSfx(); lb.classList.remove('open'); document.body.style.overflow=''; }
lb.addEventListener('click', ev=>{
  if(ev.target.hasAttribute('data-close')){ close(); return; }
  const p = ev.target.closest('.snd-play');
  if(p && !p.disabled){
    if(p.classList.contains('on') && playingFile){ stopSfx(); return; }
    if(!SND.on){ SND.on = true; saveSnd(); syncSnd(); }
    playSfx(p.dataset.sfx, null);
  }
});
document.getElementById('prev').onclick = ()=>openBy(cur-1);
document.getElementById('next').onclick = ()=>openBy(cur+1);
document.getElementById('lb-snd').onclick = ()=>{
  if(cur<0) return;
  const e = VIEW[cur];
  if(!e.sp){ stopSfx(); return; }
  if(!SND.on){ SND.on = true; saveSnd(); syncSnd(); }
  playSfx(e.sfx, null);
};
document.addEventListener('keydown', ev=>{
  if(!lb.classList.contains('open')) return;
  if(ev.key==="Escape") close();
  if(ev.key==="ArrowLeft") openBy(cur-1);
  if(ev.key==="ArrowRight") openBy(cur+1);
  if(ev.key==="s"||ev.key==="S") document.getElementById('lb-snd').click();
});

/* ---------- 事件绑定 ---------- */
let timer;
document.getElementById('q').addEventListener('input', ev=>{
  clearTimeout(timer); const v=ev.target.value;
  timer=setTimeout(()=>{S.q=v.trim(); render();}, 120);
});
document.getElementById('fam').onchange = ev=>{ S.fam=ev.target.value; render(); };
document.getElementById('sort').onchange = ev=>{ S.sort=ev.target.value; render(); };
document.getElementById('years').addEventListener('click', ev=>{
  const b=ev.target.closest('.ybtn'); if(!b) return;
  const y=b.dataset.y;
  if(S.years.has(y)) S.years.delete(y); else S.years.add(y);
  b.classList.toggle('on'); render();
});
function tgl(id, key){
  const b=document.getElementById(id);
  b.onclick = ()=>{ S[key]=!S[key]; b.classList.toggle('on', S[key]); render(); };
}
tgl('t-ex','ex'); tgl('t-do','dflt');
/* 音效开关（属于偏好设置，不参与「重置」） */
const sndBtn = document.getElementById('t-snd');
function syncSnd(){
  sndBtn.classList.toggle('on', SND.on);
  sndBtn.textContent = T(SND.on?"sndOn":"sndOff");
  sndBtn.setAttribute('aria-pressed', SND.on ? 'true' : 'false');
  document.body.classList.toggle('snd-off', !SND.on);
}
sndBtn.onclick = ()=>{
  SND.on = !SND.on; saveSnd(); syncSnd();
  if(!SND.on) stopSfx();
  else if(cur>=0 && lb.classList.contains('open')){ const e=VIEW[cur]; if(e&&e.sp) playSfx(e.sfx,null); }
};
syncSnd();
document.getElementById('reset').onclick = ()=>{
  S.q=""; S.fam=""; S.sort="idx"; S.ex=false; S.img=false; S.dflt=false; S.years.clear();
  document.getElementById('q').value=""; document.getElementById('fam').value="";
  document.getElementById('sort').value="idx";
  document.querySelectorAll('.ybtn.on').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tgl.on:not(#t-snd):not(#l-zh):not(#l-en)').forEach(b=>b.classList.remove('on'));
  syncSnd();
  render();
};
render();
</script>
</body>
</html>
